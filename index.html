<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>English to SQL Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }
        .box {
            max-width: 600px;
            background: white;
            padding: 20px;
            margin: auto;
            border-radius: 8px;
        }
        textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }
        pre {
            background: #eee;
            padding: 10px;
            margin-top: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>English → SQL Generator</h2>
    <p>Describe your query in English:</p>

    <textarea id="input" rows="4"
        placeholder="Example: select all students with marks above 80"></textarea>

    <button onclick="generateSQL()">Generate SQL</button>

    <pre id="output">Your SQL will appear here...</pre>
</div>
<script>
function generateSQL() {
    const input = document.getElementById("input").value.toLowerCase().trim();
    const output = document.getElementById("output");

    if (!input) {
        output.innerText = "Please enter a description.";
        return;
    }

    // Split words
    const words = input.split(" ");

    // Find action
    let action = "";
    ["select", "insert", "update", "delete", "create"].forEach(a => {
        if (words.includes(a)) action = a;
    });

    // Find table name (after INTO, FROM, or after CREATE TABLE)
    let table = "table_name";
    const intoIndex = words.indexOf("into");
    const fromIndex = words.indexOf("from");
    const createIndex = words.indexOf("table");

    if (intoIndex !== -1 && words[intoIndex + 1]) table = words[intoIndex + 1];
    else if (fromIndex !== -1 && words[fromIndex + 1]) table = words[fromIndex + 1];
    else if (createIndex !== -1 && words[createIndex + 1]) table = words[createIndex + 1];

    let sql = "";

    switch (action) {
        case "select":
            sql = `SELECT * FROM ${table};`;
            break;
        case "insert":
            sql = `INSERT INTO ${table} (column1, column2) VALUES (value1, value2);`;
            break;
        case "update":
            sql = `UPDATE ${table} SET column1 = value1 WHERE condition;`;
            break;
        case "delete":
            sql = `DELETE FROM ${table} WHERE condition;`;
            break;
        case "create":
            sql = `CREATE TABLE ${table} (
    id INT PRIMARY KEY,
    column1 VARCHAR(255),
    column2 VARCHAR(255)
);`;
            break;
        default:
            sql = `-- Unable to detect SQL action. Try SELECT, INSERT, UPDATE, DELETE, or CREATE TABLE.`;
    }

    output.innerText = sql;
}
</script>


</body>
</html>
