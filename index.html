<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>English to SQL Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }
        .box {
            max-width: 600px;
            background: white;
            padding: 20px;
            margin: auto;
            border-radius: 8px;
        }
        textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }
        pre {
            background: #eee;
            padding: 10px;
            margin-top: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>English → SQL Generator</h2>
    <p>Describe your query in English:</p>

    <textarea id="input" rows="4"
        placeholder="Example: select all students with marks above 80"></textarea>

    <button onclick="generateSQL()">Generate SQL</button>

    <pre id="output">Your SQL will appear here...</pre>
</div>

<script>
function generateSQL() {
    const input = document.getElementById("input").value.toLowerCase();
    const output = document.getElementById("output");

    if (!input) {
        output.innerText = "Please enter a description.";
        return;
    }

    // Simple demo logic
    if (input.includes("select") && input.includes("where")) {
        output.innerText = "SELECT * FROM table_name WHERE condition;";
    } else if (input.includes("select")) {
        output.innerText = "SELECT * FROM table_name;";
    } else {
        output.innerText = "Example SQL:\nSELECT column FROM table WHERE condition;";
    }
}
</script>


</body>
</html>
